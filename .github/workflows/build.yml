name: Build Enoch Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2.2

    steps:
      - name: Checkout repo (con submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar herramientas de build de mpy-cross
        run: |
          apt-get update
          apt-get install -y build-essential python3 python3-pip

      - name: Compilar mpy-cross
        run: |
          make -C micropython/mpy-cross

      - name: Compilar firmware ESP32-S3 (Octal SPIRAM)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd micropython/ports/esp32
          make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT submodules
          make \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            USER_C_MODULES=$GITHUB_WORKSPACE/modules/enoch_i2s/micropython.cmake \
            -j$(nproc)

      - name: Localizar .bin generado
        run: |
          find micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT -name "*.bin" -maxdepth 1

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: enoch-firmware-bin
          path: |
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/firmware.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/bootloader/bootloader.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/partition_table/partition-table.bin
          retention-days: 30
